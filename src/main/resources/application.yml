spring:
  application:
    name: best-xi

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bestxi}
    username: ${DB_USUARIO:bestxi}
    password: ${DB_PASSWORD:bestxi}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

apifootball:
  base-url: https://v3.football.api-sports.io
  key: ${API_FOOTBALL_KEY}

telegram:
  token: ${TELEGRAM_BOT_TOKEN}
  # Bot de Telegram. En el servidor: TELEGRAM_ACTIVO=false (y entonces el token no hace falta)
  activo: ${TELEGRAM_ACTIVO:true}

bestxi:
  # Fecha que usamos como "hoy" mientras solo haya datos de 2023/24.
  # Con datos reales, se quita esta línea.
  fecha-simulada: 2024-03-01

  # Webs que pueden llamar al backend (CORS), separadas por comas.
  cors-origenes: ${CORS_ORIGENES:http://localhost:5173,http://localhost:5174}

  # Endpoints /admin (importar datos y backtest). En el servidor: ADMIN_ACTIVO=false
  admin-activo: ${ADMIN_ACTIVO:true}
