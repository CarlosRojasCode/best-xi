spring:
  application:
    name: best-xi

  datasource:
    url: jdbc:postgresql://localhost:5432/bestxi
    username: bestxi
    password: bestxi

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

apifootball:
  base-url: https://v3.football.api-sports.io
  key: ${API_FOOTBALL_KEY}

telegram:
  token: ${TELEGRAM_BOT_TOKEN}

bestxi:
  # Fecha que usamos como "hoy" mientras solo haya datos de 2023/24.
  # Con datos reales, se quita esta línea.
  fecha-simulada: 2024-03-01